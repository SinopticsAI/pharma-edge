# Edge service accounts and folder roles.
# Consumed later by provision / GitHub Actions. Do not reuse logos-* accounts.

name_prefix: pharma-edge

folder_id: b1g07nbj3q7ccru38on0
cloud_id: b1gip1vv7381q4bsoaso

service_accounts:
  - name: pharma-edge-sa-func
    description: Runtime SA for Cloud Functions (Lockbox, YMQ, Object Storage, VPC to PG pooler)
    roles:
      - functions.functionInvoker
      - ymq.writer
      - ymq.reader
      - storage.editor
      - lockbox.payloadViewer
      - vpc.user

  - name: pharma-edge-sa-gateway
    description: API Gateway invokes functions, the agent container, and static bucket if needed
    roles:
      - functions.functionInvoker
      - serverless-containers.containerInvoker
      - storage.viewer

  - name: pharma-edge-sa-ci
    description: GitHub Actions deploy functions, queues, gateway spec
    roles:
      - functions.editor
      - serverless.functions.invoker
      - ymq.admin
      - storage.editor
      - lockbox.editor
      - lockbox.viewer
      - lockbox.payloadViewer
      - mdb.viewer
      - vpc.user
      - api-gateway.editor
      - serverless-containers.viewer
