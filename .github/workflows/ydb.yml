name: YDB

on:
  push:
    branches: [main]
    paths:
      - "sql/**"
      - ".github/workflows/ydb.yml"
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i /opt/yc -n
          echo "/opt/yc/bin" >> "$GITHUB_PATH"

      - name: Activate service account
        run: |
          mkdir -p "$HOME/.config/yandex-cloud"
          echo '${{ secrets.YC_SA_JSON_CREDENTIALS }}' > "$HOME/sa.json"
          yc config profile create pharma-edge-ci || true
          yc config set service-account-key "$HOME/sa.json"
          yc config set cloud-id "${{ secrets.YC_CLOUD_ID }}"
          yc config set folder-id "${{ secrets.YC_FOLDER_ID }}"

      - name: Apply SQL
        run: |
          set -euo pipefail
          YDB_ID="${{ secrets.YDB_ID }}"
          if [ -z "$YDB_ID" ]; then
            echo "YDB_ID secret is empty; skip apply"
            exit 0
          fi
          yc ydb scripting yql execute --id "$YDB_ID" --file sql/01_edge_sor.sql
          yc ydb scripting yql execute --id "$YDB_ID" --file sql/02_seed.sql
